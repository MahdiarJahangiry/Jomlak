plugins {
    id 'com.android.application'
    id 'kotlin-android'
}


android {
    namespace 'com.game.education'
    compileSdk 34

    defaultConfig {
        applicationId "com.game.education"
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName "1.1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def marketApplicationId = "ir.mservices.market"
        def marketBindAddress = "ir.mservices.market.InAppBillingService.BIND"
        manifestPlaceholders = [marketApplicationId: "${marketApplicationId}",
                                marketBindAddress  : "${marketBindAddress}",
                                marketPermission   : "${marketApplicationId}.BILLING"]
        buildConfigField "String", "IAB_PUBLIC_KEY", "\"MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCzfIm5OxNbMtR4kcM3h214EWkr85sjdCnNvOEymajhv5dCHYhTPfauLu0QcjNY+d22k+kQH/JuKm/O4W4WGAxNRVEVT45B9menJBjW14tpBO3rkdHq3fHNkkxPulri65yWu3LRPgWM40v0ok2YVks6rpocfkLwy2aI3xNnReItyQIDAQAB\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/NOTICE.md',
                    'META-INF/LICENSE.md',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/NOTICE',
                    'META-INF/INDEX.LIST'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // Tapsell
    implementation 'ir.tapsell.plus:tapsell-plus-sdk-android:2.1.6'
    // Font
    implementation 'io.github.inflationx:viewpump:2.0.3'
    implementation 'io.github.inflationx:calligraphy3:3.1.1'
    // Glide
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    // Animation
    implementation 'com.daimajia.androidanimations:library:2.4@aar'
    // Retrofit2
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // Myket
    implementation("com.github.myketstore:myket-billing-client:1.6")
    // Blur
    implementation 'com.github.jgabrielfreitas:BlurImageView:1.0.1'
    // Google
    implementation 'com.google.android.gms:play-services-auth:20.5.0'
    // Lottie
    implementation("com.airbnb.android:lottie:6.0.0")
    // ImagePicker
    implementation 'com.github.Drjacky:ImagePicker:2.3.22'

    // ====== ربات جملک ======
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    implementation 'org.json:json:20231013'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
}